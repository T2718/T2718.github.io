<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI画像＆プロンプト検索ツール</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    .search-box {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      min-width: 250px;
      padding: 10px 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    select, button {
      padding: 10px 16px;
      font-size: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    .status {
      margin-bottom: 15px;
      font-weight: bold;
      color: #555;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
    }
    .card img {
      width: 100%;
      height: 300px;
      object-fit: contain;
      background-color: #1e1e1e;
      cursor: pointer;
    }
    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .prompt-area {
      width: 100%;
      height: 90px;
      font-family: monospace;
      font-size: 12px;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      resize: vertical;
      box-sizing: border-box;
      background-color: #f9fafb;
    }
    .copy-btn {
      background-color: #10b981;
      padding: 8px;
      font-size: 13px;
    }
    .copy-btn:hover {
      background-color: #059669;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>画像＆プロンプト検索（Danbooruタグベース）</h2>
  
  <div class="search-box">
    <input type="text" id="tagInput" placeholder="検索タグをスペース区切りで入力 (例: silver_hair smile)" value="1girl solo">
    <select id="ratingSelect">
      <option value="">すべて（NSFW含む）</option>
      <option value="rating:general" selected>全年齢のみ (General)</option>
      <option value="rating:sensitive">微エロ (Sensitive)</option>
      <option value="rating:questionable">際どい (Questionable)</option>
      <option value="rating:explicit">R18 (Explicit)</option>
    </select>
    <select id="limitSelect">
      <option value="12">12件</option>
      <option value="24" selected>24件</option>
      <option value="40">40件</option>
    </select>
    <button onclick="searchImages()">検索する</button>
  </div>

  <div class="status" id="statusText">検索ボタンを押してください</div>
  <div class="grid" id="resultsGrid"></div>
</div>

<script>
  // Enterキーでも検索できるようにする
  document.getElementById("tagInput").addEventListener("keypress", function(e) {
    if (e.key === "Enter") searchImages();
  });

  async function searchImages() {
    try {
      const rawTags = document.getElementById("tagInput").value.trim();
      const rating = document.getElementById("ratingSelect").value;
      const limit = document.getElementById("limitSelect").value;
      const statusText = document.getElementById("statusText");
      const grid = document.getElementById("resultsGrid");

      // タグと年齢制限フィルターを結合（無料APIは最大2タグまで検索可能）
      let queryTags = rawTags;
      if (rating) {
        queryTags = queryTags ? `${queryTags} ${rating}` : rating;
      }

      statusText.textContent = "検索中...";
      grid.innerHTML = "";

      const url = `https://donmai.us{encodeURIComponent(queryTags)}&limit=${limit}`;

      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`APIエラー (${response.status}): 無料枠ではタグは最大2つまでしか同時指定できません。`);
        }

        const posts = await response.json();
        const validPosts = posts.filter(p => p.file_url);

        if (validPosts.length === 0) {
          statusText.textContent = "該当する画像が見つかりませんでした。";
          return;
        }

        statusText.textContent = `${validPosts.length} 件の画像を取得しました（画像クリックで原寸表示）`;

        validPosts.forEach(post => {
          // タグをAIプロンプト形式（カンマ区切り・アンダースコア削除）に変換
          const charTags = post.tag_string_character ? post.tag_string_character.replace(/_/g, " ").split(" ").join(", ") : "";
          const genTags = post.tag_string_general ? post.tag_string_general.replace(/_/g, " ").split(" ").join(", ") : "";
          const fullPrompt = [charTags, genTags].filter(Boolean).join(", ");

          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <a href="${post.file_url}" target="_blank">
              <img src="${post.large_file_url || post.file_url}" loading="lazy" alt="AI Prompt Reference">
            </a>
            <div class="card-body">
              <textarea class="prompt-area" readonly>${fullPrompt}</textarea>
              <button class="copy-btn" onclick="copyPrompt(this)">プロンプトをコピー</button>
            </div>
          `;
          grid.appendChild(card);
        });

      } catch (err) {
        statusText.textContent = error.message;
        statusText.textContent += error;
        console.error(error);
        throw error;
      }
    } catch (err) {
      alert('Error: '+err);
    }
  }

  function copyPrompt(btn) {
    const textarea = btn.previousElementSibling;
    textarea.select();
    document.execCommand("copy");
    const originalText = btn.textContent;
    btn.textContent = "コピーしました！";
    btn.style.backgroundColor = "#374151";
    setTimeout(() => {
      btn.textContent = originalText;
      btn.style.backgroundColor = "#10b981";
    }, 1500);
  }
</script>

</body>
</html>
